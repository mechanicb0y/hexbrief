# Run via scripts/taxii-up.ps1 (it passes --env-file ../../.env).
name: hexbrief-taxii
services:
  taxii:
    build: .
    image: hexbrief/medallion:39e76bf
    environment:
      TAXII_USER: ${TAXII_USER:?run scripts/gen-secrets.ps1}
      TAXII_PASSWORD: ${TAXII_PASSWORD:?run scripts/gen-secrets.ps1}
    ports:
      - "127.0.0.1:5000:5000"   # never bind to 0.0.0.0 on the host
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
