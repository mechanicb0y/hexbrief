# CI: lint, tests on fixtures (no live keys, no live feeds), TAXII round trip against
# medallion as a service container, secret scan, SAST and dependency audit.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "bandit==1.9.4" "pip-audit==2.10.1"
      - name: Ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Start medallion (lab TAXII server) for the round-trip test
        run: |
          echo "TAXII_USER=ci" >> "$GITHUB_ENV"
          TAXII_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$TAXII_PASSWORD"
          echo "TAXII_PASSWORD=$TAXII_PASSWORD" >> "$GITHUB_ENV"
          docker build -t hexbrief/medallion:ci docker/taxii
          docker run -d --name taxii -p 127.0.0.1:5000:5000 \
            -e TAXII_USER=ci -e TAXII_PASSWORD="$TAXII_PASSWORD" hexbrief/medallion:ci
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:5000/taxii2/ && break; sleep 1; done
      - name: Tests (unit + medallion round trip; live tests are skipped)
        run: pytest -q
      - name: Bandit (SAST)
        run: bandit -q -r src -ll
      - name: pip-audit (known-vulnerable dependencies)
        # Ignored IDs are transitive pins of pycti 7.261109.3 (opentelemetry-api~=1.35,
        # setuptools~=82.0) that can't be upgraded without breaking pycti; see ADR-006.
        # Remove each ignore once pycti releases with the fixed versions.
        run: >
          pip-audit --progress-spinner off
          --ignore-vuln CVE-2026-114603 --ignore-vuln CVE-2026-126360
          --ignore-vuln PYSEC-2026-3447 --ignore-vuln GHSA-xmj3-9gf7-h52w

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
